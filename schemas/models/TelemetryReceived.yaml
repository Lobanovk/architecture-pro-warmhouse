type: object
description: Пачка новых показаний, сохранённых Telemetry
required: [timestamp, readings]
properties:
  timestamp:
    type: string
    format: date-time
    description: Время публикации события сервисом Telemetry
  readings:
    type: array
    minItems: 1
    description: Показания разных устройств, сохранённые с момента прошлого события
    items:
      $ref: './TelemetryReading.yaml'
