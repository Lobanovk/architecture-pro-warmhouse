resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    location /api/v1/ {
        set $monolith http://app:8080;
        proxy_pass $monolith;
    }

    location /api/v2/devices {
        set $devices http://devices:8082;
        proxy_pass $devices;
    }

    location /api/v2/houses {
        set $devices http://devices:8082;
        proxy_pass $devices;
    }

    location /api/v2/telemetry {
        set $telemetry http://telemetry:8083;
        proxy_pass $telemetry;
    }

    location = /health {
        return 200 '{"status":"ok"}';
        default_type application/json;
    }
}
